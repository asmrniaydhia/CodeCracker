<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Siswa - CodeCracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Open Sans', sans-serif; min-height: 100vh; display: flex; }
    .left-panel { background: #1B3C53; flex: 1; display: flex; justify-content: center; align-items: center; flex-direction: column; padding: 40px; text-align: center; color: #fff; position: relative; }
    .left-panel .illustration-container { position: relative; width: 100%; max-width: 400px; margin-bottom: 20px; }
    .left-panel .illustration-container img { max-width: 100%; height: auto; display: block; margin-bottom: 15px; }
    .left-panel .brand-text { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); width: 100%; }
    .left-panel h2 { font-family: 'Lato', sans-serif; font-weight: 900; margin: 10px 0; color: #F3C623; }
    .left-panel p { color: #e0e0e0; font-size: 1rem; }
    .right-panel { flex: 1; background: #f5f9ee; display: flex; justify-content: center; align-items: center; padding: 40px; }
    .form-container { width: 100%; max-width: 450px; }
    .form-container h3 { font-family: 'Lato', sans-serif; font-weight: 900; color: #1B3C53; margin-bottom: 25px; text-align: center; }
    .form-control { padding: 12px; border-radius: 6px; border: 1px solid #1B3C53; }
    .form-label { font-weight: 700; color: #0a192f; }
    .btn-custom { background: #1B3C53; color: #fff; border: none; font-weight: 600; padding: 12px; border-radius: 6px; width: 100%; transition: all 0.3s ease; cursor: pointer; }
    .btn-custom:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0,0,0,0.2); }
    .btn-custom:active { transform: translateY(1px); box-shadow: 0 3px 8px rgba(0,0,0,0.15); }
    .alert { margin-bottom: 1rem; }
    @media (max-width: 768px) {
      body { flex-direction: column; }
      .left-panel { padding: 20px; min-height: 250px; }
      .left-panel .illustration-container { max-width: 250px; }
      .left-panel .brand-text { position: static; transform: none; margin-top: 10px; }
      .right-panel { padding: 20px; }
    }
  </style>
</head>
<body>
  <div class="left-panel">
    <div class="illustration-container">
      <img src="/assets/daftarSiswa.png" alt="Ilustrasi Siswa Daftar CodeCracker">
    </div>
    <div class="brand-text">
      <h2>CodeCracker</h2>
      <p>Belajar & Pecahkan Kode Bersama!</p>
    </div>
  </div>

  <div class="right-panel">
    <div class="form-container">
      <h3>Daftar Siswa</h3>

      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}

      <form method="post">
        {% csrf_token %}

        <div class="mb-3">
          <label class="form-label">Nama Lengkap</label>
          <input type="text" name="nama_lengkap" class="form-control" placeholder="Masukkan nama lengkap" value="{{ request.POST.nama_lengkap }}" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Alamat Email</label>
          <input type="email" name="email" class="form-control" placeholder="Masukkan email" value="{{ request.POST.email }}" required>
        </div>

        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label">Kata Sandi</label>
            <input type="password" name="kata_sandi" class="form-control" placeholder="Kata sandi" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Konfirmasi Kata Sandi</label>
            <input type="password" name="konfirmasi_sandi" class="form-control" placeholder="Ulangi kata sandi" required>
          </div>
        </div>

        <button type="submit" class="btn-custom">Daftar</button>
      </form>

      <p class="text-center mt-3">
        Sudah punya akun? <a href="{% url 'login' %}" style="color: #1B3C53; font-weight: bold;">Login di sini</a>
      </p>
    </div>
  </div>
</body>
</html>
