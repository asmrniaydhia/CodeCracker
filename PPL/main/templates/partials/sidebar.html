<style>
    /* INI ADALAH CSS SIDEBAR YANG KAMU BILANG “INI YANG SEHARUSNYA” — TIDAK DIUBAH SAMA SEKALI */
    .sidebar {
        width: 250px;
        transition: width .25s ease, padding .25s ease, background-color .25s ease;
        background-color: #f0f0f0;
        position: sticky;
        top: 0;
        z-index: 10;
        flex-shrink: 0;
        overflow: auto;
        padding-bottom: 80px;
    }

    .lesson-app.is-collapsed .sidebar {
        width: 56px;
        padding-right: 6px;
    }

    .sidebar-content {
        padding: .5rem .5rem 1rem .5rem;
    }

    .lesson-app.is-collapsed .sidebar-content {
        display: none;
    }

    /* Tombol burger — persis seperti di file kamu */
    .sidebar .burger-btn {
        margin: .5rem;
        width: 42px;
        height: 42px;
        border-radius: 12px;
        border: 1px solid #e5e7eb;
        background: #fff;
        display: grid;
        place-items: center;
        box-shadow: 0 6px 14px rgba(0, 0, 0, .08);
    }

    .burger-icon {
        width: 20px;
        height: 2px;
        background: #1B3C53;
        border-radius: 2px;
        position: relative;
        display: block;
    }

    .burger-icon::before,
    .burger-icon::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        height: 2px;
        background: #1B3C53;
        border-radius: 2px;
    }

    .burger-icon::before { top: -6px; }
    .burger-icon::after  { top: 6px;  }

    /* Responsive — persis seperti file kamu */
    @media (max-width: 992px) {
        .lesson-app { grid-template-columns: 56px 1fr; }
        .sidebar { width: 56px; }
        .sidebar-content { display: none; }
    }
</style>
