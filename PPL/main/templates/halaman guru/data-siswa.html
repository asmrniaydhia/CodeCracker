{% extends "halaman guru/base_guru.html" %}

{% block title %}CodeCracker - Data Siswa{% endblock %}

{% block extra_css %}
<style>
    /* == CSS HANYA UNTUK DATA SISWA (Filter & Tabel) == */
    .dashboard-title {
        font-family: 'Lato', sans-serif;
        font-weight: 900;
        font-size: 2.8rem;
        color: #1B3C53;
        margin-bottom: 40px;
    }
    
    .filter-form-label {
        font-weight: 600;
        color: #333;
    }
    
    .table thead {
        background-color: #1B3C53; 
        color: white;
    }
    .table th {
        font-weight: 600;
    }
    .dashboard-card {
        background-color: white;
        border-radius: 15px;
        border: none;
        box-shadow: 0 4px 25px rgba(0, 0, 0, 0.1);
    }
</style>
{% endblock %}

{% block content %}
<main class="lesson-main">
    
    <h1 class="dashboard-title">Data Siswa</h1>
    
    <div class="card dashboard-card mb-4">
        <div class="card-body p-4">
            <form>
                <div class="row g-3 align-items-end">
                    <div class="col-md-5">
                        <label for="cariNama" class="form-label filter-form-label">Cari Siswa Berdasarkan Nama:</label>
                        <input type="text" class="form-control" id="cariNama" placeholder="Cari nama siswa...">
                    </div>
                    <div class="col-md-4">
                        <label for="kelompokKelas" class="form-label filter-form-label">Kelompokkan Siswa Berdasarkan Kelas:</label>
                        <select class="form-select" id="kelompokKelas">
                            <option selected value="">Semua</option>
                            <option value="VII A">VII A</option>
                            <option value="VII B">VII B</option>
                            <option value="VII C">VII C</option>
                            </select>
                    </div>
                    <div class="col-md-3 d-flex">
                        <button type="submit" class="btn btn-primary me-2 w-100">Terapkan</button>
                        <button type="reset" class="btn btn-secondary w-100">Reset</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="card dashboard-card">
        <div class="card-body p-0"> 
            <div class="table-responsive">
                <table class="table table-hover align-middle m-0">
                    <thead>
                        <tr>
                            <th scope="col" style="padding-left: 1.5rem;">No</th>
                            <th scope="col">Nama</th>
                            <th scope="col">Kelas</th>
                        </tr>
                    </thead>
                    <tbody>
                        </tbody>
                </table>
            </div>
        </div>
    </div>

</main>
{% endblock %}
