<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CodeCracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Open Sans', sans-serif; min-height: 100vh; display: flex; }
    .left-panel { flex: 1; background: #f5f9ee; display: flex; justify-content: center; align-items: center; padding: 40px; }
    .right-panel { flex: 1; background: #1B3C53; display: flex; justify-content: center; align-items: center; flex-direction: column; padding: 40px; text-align: center; color: #fff; }
    .form-container { width: 100%; max-width: 450px; }
    .form-container h3 { font-family: 'Lato', sans-serif; font-weight: 900; color: #1B3C53; margin-bottom: 25px; text-align: center; }
    .form-control { padding: 12px; border-radius: 6px; border: 1px solid #1B3C53; }
    .form-label { font-weight: 700; color: #0a192f; }
    .btn-custom { background: #1B3C53; color: #fff; border: none; font-weight: 600; padding: 12px; border-radius: 6px; width: 100%; transition: all 0.3s ease; cursor: pointer; }
    .btn-custom:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0,0,0,0.2); }
    .btn-custom:active { transform: translateY(1px); box-shadow: 0 3px 8px rgba(0,0,0,0.15); }
    .right-panel img { max-width: 200px; margin-bottom: 15px; }
    .right-panel h2 { font-family: 'Lato', sans-serif; font-weight: 900; margin: 10px 0; color: #F3C623; }
    .right-panel p { color: #e0e0e0; font-size: 1rem; }
    .alert { margin-bottom: 1rem; } /* Tambah style alert */
    @media (max-width: 768px) {
      body { flex-direction: column; }
      .left-panel, .right-panel { padding: 20px; }
    }
  </style>
</head>
<body>
  <div class="left-panel">
    <div class="form-container">
      <h3>Login</h3>

      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" placeholder="Masukkan email" value="{{ email }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Kata Sandi</label>
          <input type="password" name="kata_sandi" class="form-control" placeholder="Masukkan kata sandi" required> </div>
        <button type="submit" class="btn-custom">Masuk</button>
      </form>

      <p class="text-center mt-3">
        Belum punya akun? <a href="{% url 'pilihan_daftar' %}" style="color: #1B3C53; font-weight: bold;">Daftar di sini</a>
      </p>
    </div>
  </div>

  <div class="right-panel">
    <img src="/static/logo.png" alt="Logo CodeCracker">
    <h2>CodeCracker</h2>
    <p>Belajar & Pecahkan Kode Bersama!</p>
  </div>
</body>
</html>
