<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Guru - CodeCracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Open Sans', sans-serif;
      min-height: 100vh;
      display: flex;
    }
    .left-panel {
      flex: 1;
      background: #f5f9ee;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
    }
    .form-container {
      width: 100%;
      max-width: 450px;
    }
    .form-container h3 {
      font-family: 'Lato', sans-serif;
      font-weight: 900;
      color: #1B3C53;
      margin-bottom: 25px;
      text-align: center;
    }
    .form-control {
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #1B3C53;
    }
    .form-label {
      font-weight: 700;
      color: #0a192f;
    }
    .btn-custom {
    background: #1B3C53;
    color: #fff;
    border: none;
    font-weight: 600;
    padding: 12px;
    border-radius: 6px;
    width: 100%;
    transition: all 0.3s ease;
    cursor: pointer;
    }

    .btn-custom:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    background: #1B3C53; 
    }

    .btn-custom:active {
    transform: translateY(1px);
    box-shadow: 0 3px 8px rgba(0,0,0,0.15);
    }

    .right-panel {
      background: #1B3C53; 
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 40px;
      text-align: center;
      color: #fff;
    }
    .right-panel img {
      max-width: 200px;
      margin-bottom: 15px;
    }
    .right-panel h2 {
      font-family: 'Lato', sans-serif;
      font-weight: 900;
      margin: 10px 0;
      color: #F3C623; 
    }
    .right-panel p {
      color: #e0e0e0;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <!-- Panel Kiri (Form Guru) -->
  <div class="left-panel">
    <div class="form-container">
      <h3>Daftar Guru</h3>
      <form>
        <div class="mb-3">
          <label for="fullname" class="form-label">Nama Lengkap</label>
          <input type="text" class="form-control" id="fullname" placeholder="Masukkan nama lengkap" required>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Alamat Email</label>
          <input type="email" class="form-control" id="email" placeholder="contoh@email.com" required>
        </div>

        <div class="row mb-3">
          <div class="col-md-6">
            <label for="password" class="form-label">Kata Sandi</label>
            <input type="password" class="form-control" id="password" placeholder="Buat kata sandi" required>
          </div>
          <div class="col-md-6">
            <label for="confirmPassword" class="form-label">Konfirmasi Kata Sandi</label>
            <input type="password" class="form-control" id="confirmPassword" placeholder="Ulangi kata sandi" required>
          </div>
        </div>

        <div class="mb-3">
          <label for="teacherCode" class="form-label">Kode Guru</label>
          <input type="text" class="form-control" id="teacherCode" placeholder="Masukkan kode registrasi guru" required>
        </div>

        <button type="submit" class="btn-custom">Daftar</button>
      </form>
    </div>
  </div>

  <!-- Panel Kanan (Informasi) -->
  <div class="right-panel">
    <img src="logo.png" alt="Logo CodeCracker">
    <h2>CodeCracker</h2>
    <p>Gabung sebagai guru dan kelola kelas dengan mudah!</p>
  </div>
</body>
</html>
