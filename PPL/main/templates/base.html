<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}CodeCracker{% endblock %}</title>

    <!-- semua link CSS dan font kamu -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Open+Sans:wght@400;600&display=swap"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/1abfd69dfb.js" crossorigin="anonymous"></script>

    <style>
      /* masukkan semua CSS kamu di sini */
    </style>
  </head>

  <body>
    <!-- Header/Navbar -->
    {% include 'partials/header.html' %}

    <!-- Layout utama dengan sidebar -->
    <div class="lesson-app" id="lessonApp">
      {% include 'partials/sidebar.html' %}
      
      <!-- Konten halaman -->
      <main class="lesson-content">
        {% block content %}
        {% endblock %}
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
