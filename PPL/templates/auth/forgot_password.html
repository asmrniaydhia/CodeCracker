{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Lupa Sandi - CodeCracker</title>
    <meta content="width=device-width, initial-scale=1.0, shrink-to-fit=no" name="viewport" />
    <link rel="icon" href="{% static 'dashboard/assets/img/kaiadmin/favicon.ico' %}" type="image/x-icon" />

    <script src="{% static 'dashboard/assets/js/plugin/webfont/webfont.min.js' %}"></script>
    <script>
      WebFont.load({
        google: { families: ["Lato:400,700,900", "Open+Sans:400,600"] },
        custom: {
          families: ["Font Awesome 5 Solid", "Font Awesome 5 Regular", "Font Awesome 5 Brands", "simple-line-icons"],
          urls: ["{% static 'dashboard/assets/css/fonts.min.css' %}"],
        },
        active: function () { sessionStorage.fonts = true; },
      });
    </script>

    <link rel="stylesheet" href="{% static 'dashboard/assets/css/bootstrap.min.css' %}" />
    <link rel="stylesheet" href="{% static 'dashboard/assets/css/plugins.min.css' %}" />
    <link rel="stylesheet" href="{% static 'dashboard/assets/css/kaiadmin.min.css' %}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            background: #f5f9ee;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .login-box {
            background: #fff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 450px;
        }

        .login-title {
            font-family: 'Lato', sans-serif;
            font-weight: 900;
            color: #1B3C53;
            font-size: 1.8rem;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .login-subtitle {
            text-align: center;
            color: #6c757d;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .form-label {
            font-weight: 700;
            color: #1B3C53;
            margin-bottom: 8px;
        }

        .form-control {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #1B3C53;
        }
        
        .form-control:focus {
            border-color: #F3C623;
            box-shadow: 0 0 0 0.2rem rgba(243, 198, 35, 0.25);
        }

        .btn-reset {
            background: #F3C623; /* Kuning */
            color: #1B3C53; /* Navy */
            border: none;
            font-weight: 800;
            padding: 12px;
            border-radius: 6px;
            width: 100%;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        .btn-reset:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(243, 198, 35, 0.3);
            background-color: #e0b41e;
        }

        .link-text { color: #1B3C53; font-weight: 700; text-decoration: none; }
        .link-text:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="login-box">
        <h3 class="login-title">Reset Kata Sandi</h3>
        <p class="login-subtitle">Masukkan email terdaftar untuk membuat sandi baru.</p>

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Email Terdaftar</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-envelope"></i></span>
                    <input type="email" name="email" class="form-control border-start-0 ps-0" placeholder="nama@email.com" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Kata Sandi Baru</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock"></i></span>
                    <input type="password" name="password_baru" class="form-control border-start-0 ps-0" placeholder="Minimal 6 karakter" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Konfirmasi Sandi</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-check-circle"></i></span>
                    <input type="password" name="konfirmasi_sandi" class="form-control border-start-0 ps-0" placeholder="Ulangi sandi baru" required>
                </div>
            </div>

            <button type="submit" class="btn-reset">Simpan Sandi Baru</button>
        </form>
        
        <div class="text-center mt-4">
            <a href="{% url 'login' %}" class="small text-muted text-decoration-none">
                <i class="fas fa-arrow-left me-1"></i> Batal & Kembali Login
            </a>
        </div>
    </div>

    <script src="{% static 'dashboard/assets/js/core/jquery-3.7.1.min.js' %}"></script>
    <script src="{% static 'dashboard/assets/js/core/popper.min.js' %}"></script>
    <script src="{% static 'dashboard/assets/js/core/bootstrap.min.js' %}"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            {% if messages %}
                {% for message in messages %}
                    Swal.fire({
                        icon: "{% if message.tags == 'error' %}error{% elif message.tags == 'success' %}success{% else %}info{% endif %}",
                        title: "{% if message.tags == 'error' %}Gagal!{% elif message.tags == 'success' %}Berhasil!{% else %}Info{% endif %}",
                        text: "{{ message|escapejs }}",
                        confirmButtonColor: "#1B3C53",
                        confirmButtonText: "OK"
                    });
                {% endfor %}
            {% endif %}
        });
    </script>

</body>
</html>
