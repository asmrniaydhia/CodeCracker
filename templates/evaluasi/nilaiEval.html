<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Nilai Evaluasi — CodeCracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body{padding-top:70px;font-family:'Open Sans',sans-serif}
    html{scroll-behavior:smooth}
    .navbar{background:#1B3C53;box-shadow:0 2px 10px rgba(0,0,0,.5);transition:box-shadow .3s,transform .3s}
    .navbar:hover{box-shadow:0 4px 20px rgba(0,0,0,.7);transform:translateY(-1px)}
    .navbar-brand{font-family:'Lato',sans-serif;font-weight:900;color:#fff}
    .nav-link{color:#fff;transition:all .3s}
    .nav-link:hover{color:#fff;text-shadow:0 0 5px rgba(168,213,226,.5);transform:translateY(-1px)}

    :root{
      --lesson-bg:#f6f7f9; --lesson-surface:#fff; --lesson-text:#1b1f24; --lesson-muted:#6b7280;
      --lesson-border:#e5e7eb; --lesson-brand:#F3C623; --lesson-brand-700:#1B3C53; --lesson-brand-100:#17a2b8;
      --lesson-radius:14px; --lesson-shadow:0 8px 20px rgba(0,0,0,.06);
    }

    .brand-bar{background:var(--lesson-brand);height:6px;border-radius:999px}
    .headline{font-weight:900}
    .subtitle{color:var(--lesson-muted)}

    .score-card{background:var(--lesson-surface);border:1px solid var(--lesson-border);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
    .btn-brand{background:var(--lesson-brand-700);color:#fff}
    .btn-brand:hover{opacity:.9;color:#fff}

    .ring{background:conic-gradient(var(--lesson-brand-700) calc(var(--p,0)*1%), #e9ecef 0);width:180px;height:180px;border-radius:50%;display:grid;place-items:center;margin:auto;transition:background .6s ease}
    .ring-inner{width:140px;height:140px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:inset 0 0 0 1px #f1f3f5}

    .badge-chip{border:1px solid var(--lesson-border);border-radius:999px;padding:.4rem .75rem;background:var(--lesson-surface);color:#0f172a}

    .pill{display:inline-flex;align-items:center;gap:.35rem;border-radius:999px;padding:.15rem .6rem;font-weight:600;font-size:.85rem}
    .pill-ok{background:rgba(25,135,84,.12);color:#146c43;border:1px solid rgba(25,135,84,.25)}
    .pill-warn{background:rgba(220,53,69,.10);color:#b02a37;border:1px solid rgba(220,53,69,.25)}

    .table thead th{background:#f8f9fa}
  </style>
</head>
<body>
  <!-- Navbar (opsional) -->
  <nav class="navbar navbar-expand-lg navbar-dark pt-2 pb-2 fixed-top">
    <div class="container-fluid ps-4 pe-4">
      <a class="navbar-brand fs-2" href="#">CodeCracker</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
              aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="#">Belajar</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Tantangan</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Leaderboard</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Informasi</a></li>
        </ul>
        <div class="d-flex">
          <a class="btn btn-sm btn-outline-light me-2" href="pilihan-daftar.html">Daftar</a>
          <button class="btn btn-sm btn-light" type="button">Masuk</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- ====== BLOK NILAI EVALUASI (tempatkan di atas form soal) ====== -->
  <div class="py-5">
    <div class="container" style="max-width:1000px">
      <div class="mb-4">
        <div class="brand-bar w-25 mb-3"></div>
        <h1 class="headline">Hasil Evaluasi Kamu</h1>
        <p class="subtitle m-0">Ringkasan nilai & progres Evaluasi</p>
      </div>

      <div class="score-card p-4 p-md-5 mb-4">
        <div class="row g-4 align-items-center">
          <div class="col-12 col-md-4 text-center">
            <div id="scoreRing" class="ring" style="--p:0">
              <div class="ring-inner">
                <div>
                  <div id="scoreNum" class="display-4 fw-bold">0</div>
                  <div class="subtitle">skor</div>
                </div>
              </div>
            </div>
            <div class="mt-3">
              <span id="grade" class="badge-chip">Menunggu perhitungan…</span>
            </div>
          </div>

          <div class="col-12 col-md-8">
            <div class="row g-3">
              <div class="col-6 col-lg-4">
                <div class="border rounded p-3 text-center">
                  <div class="subtitle small">Benar</div>
                  <div id="correctCount" class="h4 m-0 fw-bold">0</div>
                </div>
              </div>
              <div class="col-6 col-lg-4">
                <div class="border rounded p-3 text-center">
                  <div class="subtitle small">Total</div>
                  <div id="totalCount" class="h4 m-0 fw-bold">0</div>
                </div>
              </div>
              <div class="col-12 col-lg-4">
                <div class="border rounded p-3 text-center">
                  <div class="subtitle small">Status</div>
                  <div id="passFail" class="h5 m-0">-</div>
                </div>
              </div>
            </div>

            <div class="mt-4 d-flex flex-wrap gap-2">
              <a href="evaluasi.html" class="btn btn-brand">Ulangi Evaluasi</a>
            </div>
          </div>
        </div>
      </div>

      <div class="score-card p-4 mb-4">
        <h5 class="fw-bold mb-3">Rincian Evaluasi</h5>
        <div class="table-responsive">
          <table class="table align-middle">
            <thead>
              <tr>
                <th>Bagian</th>
                <th>Butir</th>
                <th>Benar</th>
                <th>Salah</th>
                <th>Hasil</th>
              </tr>
            </thead>
            <tbody id="detailBody"></tbody>
          </table>
        </div>
      </div>

      <div class="text-center text-muted small">
        CodeCracker • Evaluasi Caesar Cipher
      </div>
    </div>
  </div>

  <!-- ====== SCRIPT PENILAI (bekerja dengan form soal di bawah blok ini) ====== -->
  <script>
    // Kunci jawaban (sesuaikan dengan soal yang kamu kirim)
    const PG_KEY = {
      pg_q1:'b', pg_q2:'c', pg_q3:'b', pg_q4:'c', pg_q5:'b',
      pg_q6:'a', pg_q7:'a', pg_q8:'c', pg_q9:'c', pg_q10:'d'
    };
    const ISIAN_KEY = {
      is_q11:'ciphertext',
      is_q12:'dekripsi',
      is_q13:'dgnclct', // "belajar" digeser +2
      is_q14:'3',
      is_q15:'25'
    };

    const SCORE_KEY = 'cc_quiz_score_v2';
    const $ = (s,r=document)=>r.querySelector(s);
    const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
    const norm = s => (s ?? '').toString().trim().toLowerCase();

    function animateRingTo(percent){
      const ring = $('#scoreRing'); if(!ring) return;
      const start = Number(getComputedStyle(ring).getPropertyValue('--p')) || 0;
      const end = Math.max(0, Math.min(100, percent));
      const dur = 500; const t0 = performance.now();
      function tick(t){
        const k = Math.min(1,(t-t0)/dur);
        const v = Math.round(start+(end-start)*k);
        ring.style.setProperty('--p', v);
        $('#scoreNum').textContent = v;
        if(k<1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    function renderReport({ nilai, benar, total, detail }){
      animateRingTo(nilai);
      const grade = nilai>=90?'A':nilai>=80?'B':nilai>=70?'C':nilai>=60?'D':'E';
      $('#grade').textContent = 'Grade ' + grade;

      $('#correctCount').textContent = benar;
      $('#totalCount').textContent = total;

      const lulus = nilai >= 70;
      $('#passFail').innerHTML = lulus
        ? '<span class="pill pill-ok">Lulus</span>'
        : '<span class="pill pill-warn">Belum Lulus</span>';

      const tbody = $('#detailBody'); tbody.innerHTML = '';
      detail.forEach(row=>{
        const salah = row.total - row.correct;
        const ok = row.correct === row.total;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${row.name}</td>
          <td>${row.total}</td>
          <td>${row.correct}</td>
          <td>${salah}</td>
          <td>${ok?'<span class="pill pill-ok">Selesai</span>':'<span class="pill pill-warn">Perlu review</span>'}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function hitungDariForm(root=document){
      // Bagian A
      let benarPG = 0;
      Object.keys(PG_KEY).forEach(name=>{
        const val = norm($(`input[name="${name}"]:checked`, root)?.value);
        if(val && val === norm(PG_KEY[name])) benarPG++;
      });

      // Bagian B
      let benarIS = 0;
      Object.keys(ISIAN_KEY).forEach(id=>{
        const val = norm($(`#${id}`, root)?.value);
        if(val && val === norm(ISIAN_KEY[id])) benarIS++;
      });

      const totalPG = Object.keys(PG_KEY).length;   // 10
      const totalIS = Object.keys(ISIAN_KEY).length; // 5
      const benar = benarPG + benarIS;
      const total = totalPG + totalIS;
      const nilai = Math.round((benar/total)*100);

      return {
        nilai, benar, total,
        detail: [
          { name:'Bagian A (Pilihan Ganda)', correct:benarPG, total:totalPG },
          { name:'Bagian B (Isian)',         correct:benarIS, total:totalIS }
        ]
      };
    }

    document.addEventListener('DOMContentLoaded', ()=>{
      // Tampilkan placeholder nilai awal (0) agar UI tidak kosong
      renderReport({
        nilai:0, benar:0, total:15,
        detail:[
          { name:'Bagian A (Pilihan Ganda)', correct:0, total:10 },
          { name:'Bagian B (Isian)',         correct:0, total:5 }
        ]
      });

      // Tangkap submit dari form soal di bawah
      const form = document.getElementById('evalForm');
      const submitBtn = document.querySelector('button.btn.btn-success[type="submit"]');

      function onSubmit(e){
        if(e) e.preventDefault();
        const rep = hitungDariForm(document);
        localStorage.setItem(SCORE_KEY, String(rep.nilai));
        renderReport(rep);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      if(form){
        form.addEventListener('submit', onSubmit);
      } else if(submitBtn){
        // fallback jika form belum diberi id="evalForm"
        submitBtn.addEventListener('click', onSubmit);
      }
    });
  </script>

  <!-- ====== DI BAWAH INI TEMPATKAN FORM SOAL EVALUASI KAMU ======
  <form id="evalForm">
    ... (Bagian A & Bagian B seperti yang kamu kirim) ...
    <div class="d-grid gap-2 col-6 mx-auto mt-5">
      <button type="submit" class="btn btn-success px-4 py-2"><b>Selesaikan Evaluasi</b></button>
    </div>
  </form>
  =============================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
