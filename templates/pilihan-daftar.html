<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran - CodeCracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/1abfd69dfb.js" crossorigin="anonymous"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Open Sans', sans-serif;
      background: #f5f9ee;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .register-panel {
      background: #fff;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      max-width: 800px;
      text-align: center;
      width: 100%;
    }
    .register-panel h2 {
      font-family: 'Lato', sans-serif;
      font-weight: 900;
      color: #1B3C53;
    }
    .role-card {
      border: 2px solid #ddd;
      border-radius: 10px;
      padding: 30px;
      transition: .3s;
      color: inherit;
      text-decoration: none;
      display: block;
      height: 100%;
    }
    .role-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0,0,0,.15);
      border-color: #F3C623;
    }
    .role-card i {
      font-size: 3rem;
      color: #F3C623;
      margin-bottom: 20px;
    }
    .role-card h3 {
      font-family: 'Lato', sans-serif;
      font-weight: 700;
      color: #1B3C53;
    }
    .role-description { 
        color: #777; font-size: .95rem; 
    }
  </style>
</head>
<body>
  <div class="register-panel">
    <h2>Bergabung dengan CodeCracker</h2>
    <p class="text-muted mb-4">Pilih peran Anda untuk memulai petualangan memecahkan kode.</p>

    <div class="row g-4">
      <div class="col-md-6">
        <a href="siswa-daftar.html" class="role-card">
          <i class="fa-solid fa-graduation-cap"></i>
          <h3>Saya seorang Siswa</h3>
          <p class="role-description">Pelajari algoritma, ikuti tantangan seru, dan naikkan peringkat di leaderboard.</p>
        </a>
      </div>
      <div class="col-md-6">
        <a href="guru-daftar.html" class="role-card">
          <i class="fa-solid fa-chalkboard-user"></i>
          <h3>Saya seorang Guru</h3>
          <p class="role-description">Kelola kelas Anda, bagikan materi, dan pantau kemajuan siswa dengan mudah.</p>
        </a>
      </div>
    </div>
  </div>
</body>
</html>
